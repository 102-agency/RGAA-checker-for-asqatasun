<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8" /><title>Légendes par type correctes</title></head>
<body><main><h1>Légendes par type correctes</h1>
<figure role="figure" aria-label="Le pont"><object data="a.png" type="image/png" title="Pont" width="40" height="40"></object><figcaption>Le pont</figcaption></figure>
<figure role="group" aria-label="La tour"><embed src="b.png" type="image/png" title="Tour" width="40" height="40" /><figcaption>La tour</figcaption></figure>
<figure role="figure" aria-label="Le graphique"><canvas role="img" aria-label="Graphique" width="50" height="50"></canvas><figcaption>Le graphique</figcaption></figure>
<figure role="figure" aria-label="Entrée"><span role="img" aria-label="Étoile">★</span><figcaption>Entrée</figcaption></figure>
</main></body></html>
