<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8" /><title>Pertinence par type</title></head>
<body><main><h1>Pertinence par type</h1>
<form action="/f"><input type="image" src="b.png" alt="image" width="40" height="20" /></form>
<img src="pixel.png" usemap="#carte" alt="Carte" width="100" height="50" />
<map name="carte"><area shape="rect" coords="0,0,10,10" href="/q" alt="photo.png" /></map>
<p>Objet <object data="a.png" type="image/png" title="image" width="40" height="40"></object></p>
<p>Embarqué <embed src="b.png" type="image/png" title="image" width="40" height="40" /></p>
<p>Vectoriel <svg role="img" viewBox="0 0 24 24" width="24" height="24"><title>image</title><path d="M5 5h6"/></svg></p>
<p>Dessin <canvas role="img" aria-label="image" width="50" height="50"></canvas></p>
<p>Contenu <canvas width="50" height="50">Courbe de fréquentation en hausse.</canvas></p>
</main></body></html>
