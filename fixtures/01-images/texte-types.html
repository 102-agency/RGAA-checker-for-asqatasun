<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8" /><title>Images texte par type</title></head>
<body><main><h1>Images texte par type</h1>
<form action="/f"><input type="image" src="b.png" alt="Envoyer" width="40" height="20" /></form>
<p>Objet <object data="a.png" type="image/png" title="Titre en image" width="40" height="40"></object></p>
<p>Embarqué <embed src="b.png" type="image/png" title="Slogan en image" width="40" height="40" /></p>
<p>Dessin <canvas role="img" aria-label="Annonce en image" width="50" height="50"></canvas></p>
</main></body></html>
