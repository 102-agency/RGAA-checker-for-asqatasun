<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Composants contrastés</title>
    <style>
      body { margin: 0; padding: 16px; font: 16px/1.5 sans-serif; color: #222; background: #fff; }
      input[type='text'], textarea { border: 1px solid #767676; padding: 4px; background: #fff; color: #222; }
      .souligne { border: 0; border-bottom: 2px solid #222; padding: 4px 0; background: #fff; }
      [role='checkbox'] { display: inline-block; width: 18px; height: 18px; border: 2px solid #595959; vertical-align: middle; }
      a:focus-visible, button:focus-visible { outline: 3px solid #000; outline-offset: 2px; }
      button.libelle { background: #eee; color: #222; border: 0; padding: 8px 16px; }
      button.icone { background: #fff; border: 0; padding: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Composants contrastés</h1>
      <p><label>Nom <input type="text" name="nom" /></label></p>
      <p><label>Message <textarea name="m"></textarea></label></p>
      <p><label>Ville <input class="souligne" type="text" name="v" /></label></p>
      <p><input type="checkbox" id="c" /> <label for="c">Case native laissée telle quelle</label></p>
      <p><span role="checkbox" aria-checked="false" aria-label="Recevoir la lettre"></span> Recevoir la lettre</p>
      <p><button class="libelle" type="button">Bouton au fond pâle mais libellé visible</button></p>
      <p>
        <button class="icone" type="button" aria-label="Rechercher">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        </button>
        <button class="icone" type="button" aria-label="Valider">
          <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#1f6b55"/><path d="M9 16l5 5 9-10" fill="none" stroke="#fff" stroke-width="3"/></svg>
        </button>
        <button type="button" class="libelle">Enregistrer <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h12" stroke="#ddd" stroke-width="2"/></svg></button>
      </p>
      <p><a href="#x">Un lien au focus natif</a></p>
    </main>
  </body>
</html>
