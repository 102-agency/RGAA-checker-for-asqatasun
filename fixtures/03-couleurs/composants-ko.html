<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Composants pâles</title>
    <style>
      body { margin: 0; padding: 16px; font: 16px/1.5 sans-serif; color: #222; background: #fff; }
      input[type='text'] { border: 1px solid #ddd; padding: 4px; background: #fff; color: #222; }
      textarea { border: 0; background: #f3f3f3; padding: 4px; color: #222; }
      [role='checkbox'] { display: inline-block; width: 18px; height: 18px; border: 2px solid #ddd; vertical-align: middle; }
      a.pale:focus-visible { outline: 2px solid #ddd; }
      button.icone { background: #fff; border: 0; padding: 4px; }
      button.css-icone { width: 24px; height: 24px; border: 0; background: #fff; }
      button.css-icone::before { content: ''; display: block; width: 14px; height: 14px; border-radius: 50%; background: #ddd; margin: auto; }
    </style>
  </head>
  <body>
    <main>
      <h1>Composants pâles</h1>
      <p><label>Nom <input type="text" name="nom" /></label></p>
      <p><label>Message <textarea name="m"></textarea></label></p>
      <p><span role="checkbox" aria-checked="false" aria-label="Recevoir la lettre"></span> Recevoir la lettre</p>
      <p>
        <button class="icone" type="button" aria-label="Rechercher">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        </button>
        <button class="icone" type="button" aria-label="Valider">
          <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#2b6fd6"/><path d="M9 16l5 5 9-10" fill="none" stroke="#4a85de" stroke-width="3"/></svg>
        </button>
      </p>
      <p><button type="button" class="css-icone" aria-label="Fermer la fenêtre"></button></p>
      <p><a class="pale" href="#x">Lien au focus pâle</a></p>
    </main>
  </body>
</html>
