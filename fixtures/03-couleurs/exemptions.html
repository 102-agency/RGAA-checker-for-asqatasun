<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Cas particuliers</title>
    <style>
      body { margin: 0; padding: 16px; font: 16px/1.5 sans-serif; color: #222; background: #fff; }
      .deco { color: #ddd; font-size: 40px; }
      .ombre { color: #fff; text-shadow: 0 0 4px #000; background: #fff; padding: 8px; }
      .degrade-texte { font-size: 40px; font-weight: 700; background: linear-gradient(90deg, #333, #111); -webkit-background-clip: text; background-clip: text; color: transparent; }
      header a { color: #ccc; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <header><a href="/">Ville témoin</a></header>
    <main>
      <h1>Cas particuliers</h1>
      <p class="deco" aria-hidden="true">Filigrane décoratif</p>
      <p class="ombre">Texte clair relevé d’une ombre</p>
      <p class="degrade-texte">Titre en dégradé</p>
      <p><button type="button" disabled style="color:#ccc">Action indisponible</button></p>
    </main>
  </body>
</html>
