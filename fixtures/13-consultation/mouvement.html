<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Mouvement</title><style>
@keyframes s{from{transform:translateX(0)}to{transform:translateX(100px)}}
@keyframes b{from{opacity:1}to{opacity:0}}
.slide{width:150px;animation:s 3s linear infinite alternate}
.blink{animation:b 1s steps(2) infinite}</style></head>
<body><main><h1>Mouvement</h1><div class="slide">Je défile</div><div class="blink">Je clignote</div><marquee>Texte défilant</marquee></main></body></html>
