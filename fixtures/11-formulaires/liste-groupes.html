<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Liste personnalisée groupée</title><link rel="stylesheet" href="base.css"></head>
<body><main>
  <h1>Liste personnalisée groupée</h1>
  <div role="form" aria-label="Choix">
    <label id="lab" for="trigger">Service</label>
    <button id="trigger" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="box" aria-labelledby="lab">Choisir</button>
    <div id="box" role="listbox" aria-labelledby="lab" hidden>
      <div role="group" aria-label="Famille"><div role="option" aria-selected="false">État civil</div><div role="option" aria-selected="false">Écoles</div></div>
      <div role="group" aria-label="Cadre de vie"><div role="option" aria-selected="false">Voirie</div></div>
    </div>
  </div>
</main>
<script>
  const trigger = document.getElementById('trigger')
  const box = document.getElementById('box')
  trigger.addEventListener('click', () => {
    box.hidden = !box.hidden
    trigger.setAttribute('aria-expanded', String(!box.hidden))
  })
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { box.hidden = true } })
</script>
</body></html>
