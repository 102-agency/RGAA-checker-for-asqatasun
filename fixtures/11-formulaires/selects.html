<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Listes de choix</title><link rel="stylesheet" href="base.css"></head>
<body><main>
  <h1>Listes de choix</h1>
  <div role="form" aria-label="Choix">
    <label for="long">Commune</label>
    <select id="long" name="long">
      <option value="">Choisir</option>
      <option>Alès</option><option>Beaucaire</option><option>Bagnols</option><option>Nîmes</option>
      <option>Uzès</option><option>Vauvert</option><option>Villeneuve</option>
    </select>
    <label for="court">Réponse</label>
    <select id="court" name="court"><option>Oui</option><option>Non</option></select>
    <label for="mixte">Service</label>
    <select id="mixte" name="mixte">
      <option value="">Choisir</option>
      <option>Autre</option>
      <optgroup label="Famille"><option>État civil</option><option>Écoles</option></optgroup>
    </select>
  </div>
</main></body></html>
