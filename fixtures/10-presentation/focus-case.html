<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>focus-case</title>
<style>body{font:16px/1.5 sans-serif;color:#000;background:#fff;margin:16px}a,button{margin-right:1em}label{position:relative;display:inline-block;padding-left:28px}input{position:absolute;width:1px;height:1px;opacity:0}.box{position:absolute;left:0;top:2px;width:18px;height:18px;border:2px solid #333;background:#fff}input:focus-visible + .box{outline:3px solid #0a3d91;outline-offset:3px}</style>
</head>
<body>
<main><label><input type="checkbox"><span class="box"></span>Recevoir la lettre</label></main>
</body>
</html>
