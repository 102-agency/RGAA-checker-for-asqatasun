<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>survol-esc-ok</title>
<style>body{margin:16px;font:16px/1.5 sans-serif;color:#111;background:#fff}.tip{display:none;position:absolute;left:0;top:1.4em;background:#ffc;border:1px solid #000;padding:4px;width:220px;z-index:2}.wrap{position:relative}.wrap:hover .tip,.wrap:focus-within .tip{display:block}</style><script>document.addEventListener("keydown",function(e){if(e.key==="Escape"){var t=document.getElementById("t");if(t)t.style.display="none"}})</script>
</head>
<body>
<main><p><span class="wrap"><button type="button" aria-describedby="t">Aide</button><span id="t" role="tooltip" class="tip">Infobulle</span></span></p><p>Texte de la page placé sous l’infobulle pour qu’elle le recouvre quand elle apparaît, avec assez de mots pour occuper plusieurs lignes entières.</p></main>
</body>
</html>
