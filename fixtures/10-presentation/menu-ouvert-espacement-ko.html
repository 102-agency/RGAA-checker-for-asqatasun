<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>menu-ouvert-espacement-ko</title>
<style>body{margin:8px;font:16px/1.2 sans-serif;color:#111;background:#fff}.box{width:200px;height:2.5em;overflow:hidden}</style>
</head>
<body>
<main><button type="button" id="b" aria-expanded="false" aria-controls="p">Menu</button>
<div id="p" hidden class="box">Lorem ipsum dolor sit amet consectetur</div><script>
var b = document.getElementById('b'), p = document.getElementById('p')
b.addEventListener('click', function () {
  var open = b.getAttribute('aria-expanded') === 'true'
  b.setAttribute('aria-expanded', open ? 'false' : 'true')
  p.hidden = open
})
</script></main>
</body>
</html>
