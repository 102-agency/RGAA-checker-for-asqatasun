<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>menu-ouvert-focus-ko</title>
<style>body{margin:8px;font:16px/1.2 sans-serif;color:#111;background:#fff}#p a{outline:none}#p a:focus,#p a:focus-visible{outline:none}</style>
</head>
<body>
<main><button type="button" id="b" aria-expanded="false" aria-controls="p">Menu</button>
<div id="p" hidden><a href="#a">Premier lien du menu</a> <a href="#b2">Second lien du menu</a></div><script>
var b = document.getElementById('b'), p = document.getElementById('p')
b.addEventListener('click', function () {
  var open = b.getAttribute('aria-expanded') === 'true'
  b.setAttribute('aria-expanded', open ? 'false' : 'true')
  p.hidden = open
})
</script></main>
</body>
</html>
